<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Planner | Tessa Studio</title>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400;1,600&family=Jost:wght@300;400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header>
    <h1>Tessa's portfolio</h1>
    <nav>
      <ul>
        <li><a href="index.html">Home</a></li>
        <li><a href="about.html">About</a></li>
        <li><a href="education.html">Education</a></li>
        <li><a href="projects.html">Projects</a></li>
        <li><a href="planner.html">Planner</a></li>
        <li><a href="contact.html">Contact</a></li>
      </ul>
    </nav>
  </header>

  <main class="page-layout">
    <div class="sidebar-title">
      <h2>Task<br><em>Manager.</em></h2>
    </div>

    <div class="main-content">
      <div class="planner-box" style="margin: 0 0 30px 0; max-width: 100%;">
        <input type="text" id="taskInput" placeholder="Add a new academic task...">
        <button id="addBtn">Add</button>
      </div>

      <ul id="taskList" class="task-list" style="max-width: 100%;"></ul>
    </div>
  </main>

  <footer>
    <h1>Tessa's portfolio</h1>
    <p>© 2025 Tessa Adepeju Ademola. All Rights Reserved.</p>
  </footer>

  <script>
    const input = document.getElementById("taskInput");
    const addBtn = document.getElementById("addBtn");
    const list = document.getElementById("taskList");
    let tasks = [];

    function addTask() {
      const text = input.value.trim();
      if (text === "") return;
      tasks.push({ text: text, done: false });
      input.value = "";
      renderTasks();
    }

    function renderTasks() {
      list.innerHTML = "";
      tasks.forEach((task, index) => {
        const li = document.createElement("li");
        li.className = "task-item";
        if (task.done) li.classList.add("done");

        const span = document.createElement("span");
        span.textContent = task.text;
        
        const doneBtn = document.createElement("button");
        doneBtn.textContent = "✓";
        doneBtn.className = "btn-done";
        doneBtn.onclick = () => { tasks[index].done = !tasks[index].done; renderTasks(); };

        const delBtn = document.createElement("button");
        delBtn.textContent = "✕";
        delBtn.className = "btn-del";
        delBtn.onclick = () => { tasks.splice(index, 1); renderTasks(); };

        li.appendChild(span);
        li.appendChild(doneBtn);
        li.appendChild(delBtn);
        list.appendChild(li);
      });
    }

    addBtn.addEventListener("click", addTask);
    input.addEventListener("keypress", (e) => { if (e.key === "Enter") addTask(); });
  </script>

</body>
</html>
